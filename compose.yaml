services:
  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://hoa:hoa@postgres:5432/hoa_voice_agent
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://hoa:hoa@postgres:5432/hoa_voice_agent
      DATABASE_AUTO_CREATE: "false"
      OUTBOX_ENABLED: "true"
      SMS_MODE: ${SMS_MODE:-fake}
      VENDOR_NOTIFICATION_CHANNEL: ${VENDOR_NOTIFICATION_CHANNEL:-whatsapp}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_PHONE: ${TWILIO_FROM_PHONE:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_WHATSAPP_CONTENT_SID: ${TWILIO_WHATSAPP_CONTENT_SID:-}
      REDIS_URL: redis://redis:6379/0
      ENABLE_REDIS: "true"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  outbox:
    build: .
    command: ["python", "-m", "hoa_voice_agent.voice.outbox_worker"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://hoa:hoa@postgres:5432/hoa_voice_agent
      DATABASE_AUTO_CREATE: "false"
      OUTBOX_ENABLED: "true"
      SMS_MODE: ${SMS_MODE:-fake}
      VENDOR_NOTIFICATION_CHANNEL: ${VENDOR_NOTIFICATION_CHANNEL:-whatsapp}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_PHONE: ${TWILIO_FROM_PHONE:-}
      TWILIO_WHATSAPP_FROM: ${TWILIO_WHATSAPP_FROM:-}
      TWILIO_WHATSAPP_CONTENT_SID: ${TWILIO_WHATSAPP_CONTENT_SID:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  voice:
    profiles: ["production"]
    build:
      context: .
      dockerfile: Dockerfile.voice
    command: ["python", "-m", "hoa_voice_agent.voice.production_worker", "-t", "twilio", "--host", "0.0.0.0"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://hoa:hoa@postgres:5432/hoa_voice_agent
      DATABASE_AUTO_CREATE: "false"
      OUTBOX_ENABLED: "true"
      VOICE_ENABLE_TRACING: "true"
    ports:
      - "7860:7860"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hoa_voice_agent
      POSTGRES_USER: hoa
      POSTGRES_PASSWORD: hoa
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoa -d hoa_voice_agent"]
      interval: 3s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
